<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <title>تفاصيل الخبر - PIU</title>
  
  <style>
    /* ===== Header ===== */
    .news-details-header {
      background: linear-gradient(135deg, #1d3d6d, #2a5d9f);
      color: #fff;
      padding: 120px 20px 40px;
      text-align: center;
    }
    
    .news-details-header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    
    .news-details-header a {
      color: #fff;
      opacity: 0.8;
      text-decoration: none;
      transition: opacity 0.3s;
    }
    
    .news-details-header a:hover {
      opacity: 1;
    }
    
    .lang-switch-container {
      text-align: center;
      margin-top: 20px;
    }
    
    .lang-switch-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 8px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
    }
    
    .lang-switch-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    
    .news-details-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px 60px;
    }
    
    .image-gallery {
      position: relative;
      width: 100%;
      height: 450px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 30px;
      background: #f7f9fc;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    
    .image-gallery .slides {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.5s ease-in-out;
    }
    
    .image-gallery .slide {
      min-width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f9fc;
    }
    
    .image-gallery .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }
    
    .gallery-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.5);
      color: #fff;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .gallery-btn:hover {
      background: rgba(0,0,0,0.8);
      transform: translateY(-50%) scale(1.1);
    }
    
    .gallery-btn.prev {
      left: 15px;
    }
    
    .gallery-btn.next {
      right: 15px;
    }
    
    .gallery-dots {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    
    .gallery-dots .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }
    
    .gallery-dots .dot.active {
      background: #2a5d9f;
      border-color: #fff;
      transform: scale(1.2);
    }
    
    .gallery-dots .dot:hover {
      background: rgba(255,255,255,0.8);
    }
    
    .image-counter {
      position: absolute;
      bottom: 70px;
      right: 20px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 10;
    }
    
    .news-details-container h1 {
      color: #1d3d6d;
      font-size: 2rem;
      margin-bottom: 15px;
    }
    
    .news-details-meta {
      display: flex;
      gap: 20px;
      margin-bottom: 25px;
      color: #666;
      flex-wrap: wrap;
    }
    
    .news-details-meta .category {
      background: #2a5d9f;
      color: #fff;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
    }
    
    .news-details-container p {
      font-size: 1.1rem;
      line-height: 1.9;
      color: #444;
      white-space: pre-wrap;
    }
    
    .news-details-info {
      background: #f7f9fc;
      padding: 20px 25px;
      border-radius: 12px;
      margin: 25px 0;
      border-right: 4px solid #2a5d9f;
    }
    
    .news-details-info p {
      margin-bottom: 8px;
      font-size: 1rem;
      color: #444;
      white-space: normal;
    }
    
    .news-details-info p:last-child {
      margin-bottom: 0;
    }
    
    .news-details-info strong {
      color: #1d3d6d;
    }
    
    .back-to-news {
      display: inline-block;
      margin-top: 30px;
      color: #2a5d9f;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }
    
    .back-to-news:hover {
      color: #1d3d6d;
      text-decoration: underline;
    }
    
    [dir="rtl"] .news-details-info {
      border-right: none;
      border-left: 4px solid #2a5d9f;
    }
    
    [dir="rtl"] .gallery-btn.prev {
      left: auto;
      right: 15px;
    }
    
    [dir="rtl"] .gallery-btn.next {
      right: auto;
      left: 15px;
    }
    
    [dir="rtl"] .image-counter {
      right: auto;
      left: 20px;
    }
    
    @media (max-width: 768px) {
      .news-details-header {
        padding: 100px 16px 30px;
      }
      
      .news-details-header h1 {
        font-size: 1.6rem;
      }
      
      .news-details-container {

      }
      
      .news-details-container h1 {
        font-size: 1.3rem;
      }
      
      .news-details-container p {
        font-size: 0.95rem;
      }
      
      .image-gallery {
        height: 300px;
      }
      
      .gallery-btn {
        width: 40px;

      }
      
      .gallery-btn.prev {
        left: 10px;
      }
      
      .gallery-btn.next {
        right: 10px;
      }
      
      [dir="rtl"] .gallery-btn.prev {
        left: auto;
        right: 10px;
      }
      
      [dir="rtl"] .gallery-btn.next {
        right: auto;
        left: 10px;
      }
    }
    
    @media (max-width: 480px) {
      .image-gallery {
        height: 220px;
      }
      
      .gallery-btn {
        width: 32px;
        height: 32px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>

      // ===== الخبر 5 =====
      "5": {
        category: "ورشة عمل",
        date: "📅 30 - 31 أغسطس 2026",
        title: "الورشة التحضيرية لتقييم الشبكات الكهربائية المصغرة في المناطق الريفية المرشحة لمشروع RESET",
        description: "أقيمت، برعاية وزير الكهرباء والطاقة المهندس عدنان الكاف وبدعم من البنك الدولي، ورشة العمل المصغرة الخاصة بتقييم ودراسة الشبكات الكهربائية المصغرة في المناطق الريفية المستهدفة، ضمن أنشطة المكوّن الثاني من مشروع تعافي قطاع الكهرباء من اجل انتقال عادل في اليمن (RESET)، وبمشاركة الجهات والكوادر الفنية ذات العلاقة.",
        info: `

        `,
        fullDescription: `<p>ويهدف المكوّن الثاني من مشروع RESET إلى دعم إيصال خدمة الكهرباء إلى عدد من المناطق الريفية المستهدفة، من خلال إنشاء وتطوير محطات وشبكات كهربائية مصغرة وفق احتياجات ومتطلبات كل منطقة، بما يسهم في تحسين الوصول إلى خدمة الكهرباء وتعزيز استدامتها في المناطق التي تعاني من محدودية أو انعدام الخدمة.</p><br><p>ويُعد مشروع تعافي قطاع الكهرباء من اجل انتقال عادل في اليمن (RESET) أحد المشاريع الرئيسية الهادفة إلى دعم قطاع الكهرباء في اليمن، وتبلغ قيمته الإجمالية نحو 140 مليون دولار أمريكي، ويتضمن ثلاثة مكونات رئيسية ومتكاملة.</p><br><p>ويستهدف المكوّن الأول تنفيذ أعمال لتطوير وتأهيل شبكات النقل والتوزيع في محافظة عدن، بما يسهم في فك الاختناقات في الشبكة، وتحسين كفاءة منظومة الكهرباء، والحد من الفاقد، وتعزيز موثوقية واستقرار الخدمة الكهربائية.</p><br><p>فيما يركز المكوّن الثاني على إنشاء محطات وشبكات كهربائية مصغرة في المناطق الريفية المستهدفة، بهدف إيصال خدمة الكهرباء إلى المجتمعات والمناطق التي لا تصل إليها الشبكة الرئيسية، بما يساهم في تحسين الظروف المعيشية ودعم الأنشطة الاقتصادية والخدمية في تلك المناطق.</p><br><p>وتأتي ورشة التقييم الحالية ضمن الخطوات الأساسية للتحضير لتنفيذ هذا المكوّن، من خلال تقييم المواقع المقترحة ودراسة احتياجاتها الفنية والكهربائية، بما يساعد على تحديد الخيارات والحلول المناسبة لتنفيذ مشاريع الشبكات المصغرة وفق المعايير الفنية المعتمدة.</p>`
      },
      
      // ===== الخبر 6 =====
      "6": {
        category: "ورشة عمل",

        info: `
          <p><strong>📍 المكان:</strong> عمّان - الأردن</p>

        fullDescription: `<p>وهدفت الورشة إلى استكمال الترتيبات النهائية المتعلقة بمكونات مشروع RESET، ومناقشة الأطر الفنية والقانونية والتنفيذية والمؤسسية، إلى جانب تحديد المسؤوليات والأدوار بين مختلف الجهات ذات العلاقة، والاتفاق على آليات التنسيق والعمل والتنفيذ خلال المراحل القادمة من المشروع. وكذلك تم استعراض الخطة الاستراتيجية للطاقة في الطاولة المستديرة في اليوم الثاني بالتعاون مع فريق FCDO و TAFFY.</p><br><p>وشهدت الورشة على مدى خمسة أيام نقاشات مكثفة حول المكونات الأربعة للمشروع، شملت الجوانب الفنية والتنفيذية والقانونية، وآليات العمل والتنسيق بين الأطراف، بما في ذلك تحديد المسؤوليات والأدوار المؤسسية وآليات المتابعة والتنفيذ، وصولاً إلى التفاهمات اللازمة للانتقال إلى المرحلة التنفيذية للمشروع.</p><br><p>كما تناولت النقاشات عدداً من الجوانب المرتبطة بمشاركة القطاع الخاص وتطوير البيئة المؤسسية والتنظيمية ذات الصلة، بما يعزز فرص الاستدامة والاستفادة من التدخلات التي يستهدفها المشروع.</p><br><p>وأكد المشاركون أهمية ما تم التوصل إليه خلال الورشة من تفاهمات حول مختلف الملفات المطروحة، والتي من شأنها أن تمهد للانتقال إلى الخطوات العملية لتنفيذ المشروع وفق الأطر المتفق عليها، وبما يحقق أهدافه في دعم وتعافي قطاع الكهرباء في اليمن وتحسين موثوقية واستدامة خدمات الكهرباء.</p><br><p>وفي ختام الورشة، عبّر ممثلو وزارة الكهرباء والطاقة والبنك الدولي وشركاء المشروع عن تقديرهم للجهود التي بذلتها جميع الفرق المشاركة، مؤكدين أن المخرجات التي تم التوصل إليها خلال الورشة تمثل خطوة مهمة نحو استكمال الترتيبات اللازمة للبدء في تنفيذ مشروع RESET.</p><br><p>ويأتي مشروع RESET في إطار الجهود الرامية إلى دعم قطاع الكهرباء في اليمن، من خلال تنفيذ مجموعة من التدخلات ذات الأولوية، وتعزيز قدرات المؤسسات الوطنية، ودعم تطوير حلول كهرباء أكثر استدامة واستجابة للاحتياجات التنموية والخدمية في اليمن.</p><br><p>وأكدت الوحدة التنفيذية للمشاريع الممولة خارجياً استمرارها في العمل والتنسيق الوثيق مع وزارة الكهرباء والطاقة والبنك الدولي وشركاء المشروع، بما يسهم في ضمان الإعداد والتنفيذ الفاعل لمكونات المشروع، وتعزيز دور المؤسسات الوطنية في إدارة وتنفيذ مشاريع قطاع الكهرباء الممولة من شركاء التنمية.</p>`

    en: {

      // ===== News 5 =====

        description: "Under the patronage of the Minister of Electricity and Energy, Eng. Adnan Al-Kaf, and with support from the World Bank, a mini-workshop was held to assess and study mini-grid electricity networks in targeted rural areas, as part of Component 2 of the Yemen Emergency Electricity Restoration Project (RESET), with the participation of relevant technical authorities and staff.",

        fullDescription: `<p>Component 2 of the RESET project aims to support the provision of electricity services to targeted rural areas through the establishment and development of mini-grid electricity stations and networks according to the needs and requirements of each area, contributing to improved access to electricity and enhancing its sustainability in areas with limited or no service.</p><br><p>The Yemen Emergency Electricity Restoration Project (RESET) is one of the main projects aimed at supporting Yemen's electricity sector, with a total value of approximately $140 million USD, and includes three main integrated components.</p><br><p>Component 1 targets the implementation of works to develop and rehabilitate transmission and distribution networks in Aden Governorate, contributing to resolving bottlenecks in the network, improving the efficiency of the electricity system, reducing losses, and enhancing the reliability and stability of electricity service.</p><br><p>Component 2 focuses on establishing mini-grid electricity stations and networks in targeted rural areas to deliver electricity services to communities and areas not connected to the main grid, contributing to improved living conditions and supporting economic and service activities in those areas.</p><br><p>The current assessment workshop is among the essential steps in preparing for the implementation of this component, through evaluating proposed sites and studying their technical and electrical needs to identify appropriate options and solutions for implementing mini-grid projects according to approved technical standards.</p>`
      },
      
      // ===== News 6 =====
      "6": {
        category: "Workshop",
        date: "📅 16 September 2026",
        title: "Conclusion of RESET Project Workshop in Amman, Jordan",
        description: "In Amman, Jordan, a five-day workshop on the Yemen Electricity Recovery Project (RESET) and the Strategic Plan for Developing Yemen’s Energy Sector came to a close. Participants included representatives of Yemen’s Ministry of Electricity and Energy, the World Bank, the United Nations Office for Project Services (UNOPS), the United Nations Development Programme (UNDP), and the Economic and Private Sector Development Adviser at the United Kingdom’s Foreign, Commonwealth & Development Office (UK FCDO).",
        info: `
          <p><strong>📍 Venue:</strong> Amman - Jordan</p>

        fullDescription: `<p>The workshop aimed to complete the final arrangements related to the RESET project components, and discuss the technical, legal, executive, and institutional frameworks, in addition to defining responsibilities and roles among the various relevant parties, and agreeing on coordination, work, and implementation mechanisms during the upcoming phases of the project. The Strategic Energy Plan was also reviewed at the roundtable on the second day in cooperation with the FCDO and TAFFY teams.</p><br><p>Over five days, the workshop witnessed intensive discussions on the four components of the project, covering technical, executive, and legal aspects, as well as work and coordination mechanisms between the parties, including defining institutional responsibilities and roles, and follow-up and implementation mechanisms, leading to the necessary understandings to move to the implementation phase of the project.</p><br><p>The discussions also addressed a number of aspects related to private sector participation and the development of the relevant institutional and regulatory environment, which enhances sustainability opportunities and benefits from the interventions targeted by the project.</p><br><p>Participants emphasized the importance of the understandings reached during the workshop on the various issues raised, which would pave the way for moving to practical steps for implementing the project according to the agreed frameworks, and in a way that achieves its objectives in supporting and recovering the electricity sector in Yemen and improving the reliability and sustainability of electricity services.</p><br><p>At the conclusion of the workshop, representatives of the Ministry of Electricity and Energy, the World Bank, and project partners expressed their appreciation for the efforts made by all participating teams, emphasizing that the outputs reached during the workshop represent an important step towards completing the necessary arrangements to start implementing the RESET project.</p><br><p>The RESET project comes within the efforts aimed at supporting the electricity sector in Yemen, through implementing a set of priority interventions, enhancing the capacities of national institutions, and supporting the development of more sustainable electricity solutions that respond to development and service needs in Yemen.</p><br><p>The Project Implementation Unit for Externally Funded Projects confirmed its continued work and close coordination with the Ministry of Electricity and Energy, the World Bank, and project partners, contributing to ensuring the effective preparation and implementation of the project components, and enhancing the role of national institutions in managing and implementing electricity sector projects funded by development partners.</p>`

      { src: 'images/reset1.png', alt: 'ورشة العمل 2' },
      { src: 'images/reset3.png', alt: 'ورشة العمل 3' },
      { src: 'images/reset4.png', alt: 'ورشة العمل 4' },
      { src: 'images/reset2.png', alt: 'ورشة العمل 5' },
      { src: 'images/reset6.png', alt: 'ورشة العمل 6' },
      { src: 'images/reset8.png', alt: 'ورشة العمل 7' },
      { src: 'images/reset12.png', alt: 'ورشة العمل 8' }
    ],
    "6": [
      { src: 'images/reset_end.png', alt: 'اختتام ورشة RESET في عمّان' }
    ]
  };

  // ===== اختيار الصور المناسبة =====
  const images = newsImages[newsId] || newsImages["5"];

  // ===== معرض الصور =====
  let currentSlide = 0;
  
  function initGallery() {
    const slidesContainer = document.getElementById('slides');
    const dotsContainer = document.getElementById('galleryDots');
    const counter = document.getElementById('imageCounter');
    
    if (!slidesContainer) return;
    
    slidesContainer.innerHTML = '';
    dotsContainer.innerHTML = '';
    
    if (!images || images.length === 0) {
      slidesContainer.innerHTML = '<div class="slide"><p style="color:#999;">لا توجد صور</p></div>';
      if (counter) counter.textContent = '0 / 0';
      return;
    }
    
    images.forEach((img, index) => {
      const slide = document.createElement('div');
      slide.className = 'slide';
      slide.innerHTML = `<img src="${img.src}" alt="${img.alt}" loading="lazy" onerror="this.style.display='none'">`;
      slidesContainer.appendChild(slide);
      
      const dot = document.createElement('span');
      dot.className = 'dot' + (index === 0 ? ' active' : '');
      dot.onclick = () => goToSlide(index);
      dotsContainer.appendChild(dot);
    });
    
    updateCounter();
    goToSlide(0);
    
    // إخفاء أزرار التنقل والنقاط إذا كانت صورة واحدة فقط
    if (images.length <= 1) {
      const prevBtn = document.querySelector('.gallery-btn.prev');
      const nextBtn = document.querySelector('.gallery-btn.next');
      if (prevBtn) prevBtn.style.display = 'none';
      if (nextBtn) nextBtn.style.display = 'none';
      if (dotsContainer) dotsContainer.style.display = 'none';
    }
  }
  
  function goToSlide(index) {
    const slidesContainer = document.getElementById('slides');
    const dots = document.querySelectorAll('.dot');
    const total = images.length;
    
    if (!slidesContainer || total === 0) return;
    
    if (index < 0) index = total - 1;
    if (index >= total) index = 0;
    
    currentSlide = index;
    slidesContainer.style.transform = `translateX(-${index * 100}%)`;
    
    dots.forEach((dot, i) => {
      dot.classList.toggle('active', i === index);
    });
    
    updateCounter();
  }
  
  function changeSlide(direction) {
    goToSlide(currentSlide + direction);
  }
  
  function updateCounter() {
    const counter = document.getElementById('imageCounter');
    if (counter) {
      counter.textContent = `${currentSlide + 1} / ${images.length}`;
    }
  }
  
  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') changeSlide(-1);
    else if (e.key === 'ArrowRight') changeSlide(1);
  });

  // ===== الحصول على اللغة الحالية =====
  let currentLang = localStorage.getItem('lang') || 'ar';

  function toggleLang() {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    localStorage.setItem('lang', currentLang);
    applyTranslation(currentLang);
    document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    document.documentElement.lang = currentLang;
  }

  function applyTranslation(lang) {
    const t = translations[lang];
    
    document.getElementById('details-page-title').textContent = t.pageTitle;
    document.getElementById('back-to-news-link').innerHTML = '<i class="fa-solid fa-arrow-right"></i> ' + t.backLink;
    document.getElementById('lang-switch-text').textContent = t.langSwitch;
    document.getElementById('back-to-news-text').textContent = t.backToNews;
    
    // ===== بيانات الخبر حسب المعرّف =====
    const newsData = t[newsId] || t["5"];
    
    document.getElementById('detailCategory').textContent = newsData.category;
    document.getElementById('detailDate').textContent = newsData.date;
    document.getElementById('detailTitle').textContent = newsData.title;
    document.getElementById('detailDescription').textContent = newsData.description;
    document.getElementById('detailInfo').innerHTML = newsData.info;
    document.getElementById('detailFullDescription').innerHTML = newsData.fullDescription;
    
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.documentElement.lang = lang;
  }

  document.addEventListener('DOMContentLoaded', function() {
    initGallery();
    applyTranslation(currentLang);
  });
</script>

</body>
</html>
